<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everslim — Weight Management Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#CB4AA2; --pink-dark:#A9337F; --chartreuse:#E0E32D; --mint:#BCEBD2;
    --ink:#02433E; --ink-soft:#5C7C77; --bg:#FFFFFF; --border:#D8D8D6;
    --red:#B3261E; --red-bg:#FDECEC; --red-border:#F3C2BE;
    --amber:#8A6A00; --amber-bg:#FFF8E1; --amber-border:#EFDD9A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter', Arial, Helvetica, sans-serif;background:var(--bg);color:var(--ink);}
  .stage{max-width:640px;margin:0 auto;padding:28px 24px 60px;min-height:100vh;display:flex;flex-direction:column;}

  .stage-indicator{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;}
  .stage-pill{
    font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;
    padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);color:var(--ink-soft);
    white-space:nowrap;
  }
  .stage-pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .stage-pill.done{border-color:var(--ink);color:var(--ink);}
  .stage-line{flex:0 0 14px;height:1.5px;background:var(--border);}

  .progress-line{
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:'Fraunces', Georgia, serif;font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:28px;
  }
  .progress-line .inf{color:var(--chartreuse);font-size:15px;}

  .question-block{flex:1;}
  .question-block h1{font-family:'Fraunces', Georgia, serif;font-weight:700;font-size:30px;line-height:1.18;color:var(--ink);margin:0 0 8px;}
  .question-hint{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px;}
  .key-copy{background:#F7F5EF;border:1px solid var(--border);border-radius:12px;padding:16px 18px;font-size:13.5px;color:var(--ink-soft);margin:14px 0 22px;}

  .choose-label{font-family:'Fraunces', Georgia, serif;font-weight:700;font-size:17px;color:var(--ink);margin:22px 0 12px;}
  .option-list{display:flex;flex-direction:column;gap:12px;margin-bottom:8px;}
  .option-btn{
    display:block;width:100%;text-align:left;font-family:'Fraunces', Georgia, serif;
    font-size:16px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--border);
    border-radius:14px;padding:14px 18px;cursor:pointer;transition:border-color .15s, background .15s;
  }
  .option-btn:hover{border-color:var(--ink-soft);}
  .option-btn.selected{border-color:var(--ink);}
  .option-btn.multi.selected{background:#FBEBF5;border-color:var(--pink);}
  .capture-btn{
    display:block;width:100%;text-align:center;font-family:'Fraunces', Georgia, serif;
    font-size:16px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--border);
    border-radius:14px;padding:14px 18px;cursor:pointer;
  }
  .capture-btn:hover{border-color:var(--ink-soft);}

  input[type=text], input[type=date], input[type=number], input[type=tel], input[type=email], input[type=file], textarea, select{
    width:100%;font-family:inherit;font-size:15px;padding:11px 12px;border:2px solid var(--border);
    border-radius:10px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:90px;font-family:'Inter',sans-serif;}
  input:focus, textarea:focus, select:focus{outline:none;border-color:var(--ink);}

  .group-field{margin:18px 0;}
  .group-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;}
  .group-field .subhint{font-size:12px;color:var(--ink-soft);margin-top:5px;}

  .tri-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
  .tri-row:last-child{border-bottom:none;}
  .tri-row .tri-label{font-size:13.5px;font-weight:600;color:var(--ink);flex:1;}
  .tri-btns{display:flex;gap:6px;flex-shrink:0;}
  .tri-btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;padding:7px 12px;border-radius:16px;border:1.5px solid var(--border);background:#fff;color:var(--ink-soft);cursor:pointer;}
  .tri-btn.selected{background:var(--ink);color:#fff;border-color:var(--ink);}

  .inline-yesno{display:flex;gap:8px;margin-top:8px;}
  .inline-btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;padding:9px 16px;border-radius:18px;border:1.5px solid var(--border);background:#fff;color:var(--ink-soft);cursor:pointer;}
  .inline-btn.selected{background:var(--ink);color:#fff;border-color:var(--ink);}

  .info-card{background:#F7F5EF;border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin:18px 0;}
  .info-card .bmi-value{font-family:'Fraunces',serif;font-size:40px;font-weight:700;color:var(--ink);margin:6px 0;}
  .info-card .bmi-cat{display:inline-block;background:var(--chartreuse);color:var(--ink);font-weight:700;font-size:12px;padding:4px 12px;border-radius:20px;}

  .exit-card{background:var(--red-bg);border:1px solid var(--red-border);border-radius:14px;padding:22px;margin:16px 0;}
  .exit-card.neutral{background:#F7F5EF;border-color:var(--border);}
  .exit-card p{margin:0;font-size:14px;color:var(--red);font-weight:600;line-height:1.55;}
  .exit-card.neutral p{color:var(--ink-soft);font-weight:400;}
  .crisis-box{background:#fff;border:1px solid var(--red-border);border-radius:10px;padding:14px 16px;margin-top:14px;font-size:13px;color:var(--ink);}
  .crisis-box strong{display:block;margin-bottom:4px;color:var(--red);}

  .amber-tag{display:inline-block;background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber);font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:10px;}

  .review-section{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .review-section .rs-head{display:flex;align-items:center;justify-content:space-between;}
  .review-section .rs-head h3{font-family:'Fraunces',serif;font-size:15.5px;margin:0;color:var(--ink);}
  .review-section .rs-edit{font-size:12px;font-weight:700;color:var(--pink-dark);background:none;border:none;cursor:pointer;}
  .review-section .rs-body{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.6;}

  .actions{margin-top:30px;}
  .next-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px 20px;border:none;
    border-radius:32px;cursor:pointer;font-family:'Fraunces', Georgia, serif;font-weight:700;font-size:17px;color:var(--ink);
    background:linear-gradient(90deg, var(--mint) 0%, var(--chartreuse) 18%, var(--chartreuse) 82%, #F3B6DD 100%);
  }
  .next-btn:disabled{background:#EDECE7;color:#A8A49A;cursor:not-allowed;}
  .next-btn.secondary{background:#fff;border:2px solid var(--ink);color:var(--ink);margin-top:12px;}
  .prev-link{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-family:'Fraunces', Georgia, serif;font-weight:700;font-size:14px;color:var(--ink);background:none;border:none;cursor:pointer;padding:0;}
  .prev-link[hidden]{display:none;}

  .welcome-screen h1{font-size:34px;}
  .welcome-cta-list{display:flex;flex-direction:column;gap:12px;margin-top:26px;}

  .final-screen{text-align:center;padding-top:60px;}
  .final-screen h1{font-family:'Fraunces',serif;font-size:28px;color:var(--ink);}
  .final-screen p{font-size:14px;color:var(--ink-soft);max-width:440px;margin:14px auto 0;}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="stage-indicator" id="stageIndicator"></div>
  <div class="progress-line" id="progressLine"><span class="inf">∞</span><span id="progressText">0% Complete</span><span class="inf">∞</span></div>
  <div class="question-block" id="questionBlock"></div>
  <div class="actions" id="actionsBlock">
    <button type="button" class="next-btn" id="nextBtn" disabled>Next →</button>
    <button type="button" class="prev-link" id="prevBtn"><span>←</span> Previous Question</button>
  </div>
</div>

<script>
(function(){
  const YESNO = [{v:'yes',l:'Yes'},{v:'no',l:'No'}];
  const YESNONA = [{v:'yes',l:'Yes'},{v:'no',l:'No'},{v:'na',l:'Not applicable'}];
  const PHQ_SCALE = [{v:'0',l:'0 — Not at all'},{v:'1',l:'1 — Several days'},{v:'2',l:'2 — More than half the days'},{v:'3',l:'3 — Nearly every day'}];
  const STAGES = [{n:1,label:'About you'},{n:2,label:'Your health'},{n:3,label:'Review'}];

  const COMORBIDITY = [
    {v:'hypertension',l:'Hypertension'},{v:'dyslipidaemia',l:'Dyslipidaemia or high cholesterol'},
    {v:'osa',l:'Obstructive sleep apnoea'},{v:'cvd',l:'Cardiovascular disease'},
    {v:'prediabetes',l:'Prediabetes'},{v:'t2d',l:'Type 2 diabetes'},
    {v:'other',l:'Another weight-related condition'},{v:'none',l:'None'},{v:'unsure',l:'Unsure'}
  ];

  const MEDICAL_HISTORY = [
    {v:'pancreatitis',l:'Pancreatitis'},{v:'gallstones',l:'Gallstones or gallbladder disease'},
    {v:'gastroparesis',l:'Severe gastrointestinal disease or gastroparesis'},
    {v:'severe_abdo_pain',l:'Severe or persistent abdominal pain'},{v:'vomiting_dehydration',l:'Repeated vomiting, severe diarrhoea or dehydration'},
    {v:'visual_symptoms',l:'Sudden or rapidly worsening visual symptoms'},
    {v:'diabetes_type',l:'Type 1 or type 2 diabetes'},{v:'insulin_su',l:'Insulin or sulfonylurea use'},
    {v:'hypoglycaemia',l:'Hypoglycaemia'},{v:'retinopathy',l:'Diabetic retinopathy or visual changes'},
    {v:'kidney_liver',l:'Kidney or liver disease'},{v:'thyroid_endocrine',l:'Thyroid or endocrine disease'},
    {v:'active_cancer',l:'Active cancer or cancer treatment'},{v:'mental_health_condition',l:'Significant mental-health condition'},
    {v:'bariatric_surgery',l:'Previous bariatric or gastrointestinal surgery'},
    {v:'malabsorption',l:'Malabsorption or nutritional deficiency'},{v:'frailty',l:'Frailty or major mobility problems'},
    {v:'planned_procedure',l:'Planned surgery, endoscopy or deep sedation'},{v:'unexplained_loss',l:'Unexplained recent weight loss'}
  ];

  const ETHNICITY_OPTIONS = ['White British','White — other background','Mixed / Multiple ethnic groups','Asian or Asian British','Black African, Caribbean or Black British','Chinese','Other ethnic group','Prefer not to say'];
  const SOURCE_OPTIONS = ['Home scales / tape measure','Pharmacy or clinic measurement','GP or NHS record','Other'];
  const MEDICINE_OPTIONS = ['Saxenda® (liraglutide)','Wegovy® (semaglutide)','Mounjaro® (tirzepatide)','Orlistat','Orforglipron','No preference'];
  const TREATMENT_PRODUCTS = [
    {v:'saxenda', l:'Saxenda® (liraglutide)', price:'£189 / month'},
    {v:'wegovy', l:'Wegovy® (semaglutide)', price:'£179 / month'},
    {v:'mounjaro', l:'Mounjaro® (tirzepatide)', price:'£169 / month'},
    {v:'orlistat', l:'Orlistat', price:'£45 / month'},
    {v:'orforglipron', l:'Orforglipron', price:'£179 / month'}
  ];

  const EXIT = {
    ageRestricted: {title:"This service isn't available to you yet", body:"This weight-management pathway is only available to people aged 18 or over. Please speak to your GP about options suitable for your age group.", ctas:[{label:'Exit assessment', action:'restart'}]},
    jurisdiction: {title:"This service is only available in the UK", body:"We're only able to offer this assessment to people currently in the UK. Please contact a local healthcare provider for support.", ctas:[{label:'Exit assessment', action:'restart'}]},
    noConsent: {title:"We're not able to continue", body:"A safe remote assessment can't be completed without your consent to clinical assessment. You're welcome to return and start again at any time, or speak to your GP directly.", ctas:[{label:'Exit assessment', action:'restart'}]},
    notForSelf: {title:"This pathway is for the patient themselves", body:"This online assessment can only be completed by the person who will be receiving treatment. If you're helping someone else, please contact us directly so we can arrange the right kind of support for them.", ctas:[{label:'Exit assessment', action:'restart'}]},
    notEligibleBmi: {title:"You don't currently meet the BMI criteria for this pathway", body:"Based on the measurements entered, you don't currently meet the usual licensed BMI criteria for these medicines through this service.", ctas:[{label:'View other weight-management support', action:'restart'},{label:'Speak to my GP', action:'restart'},{label:'Exit assessment', action:'restart'}]},
    notEligibleComorbid: {title:"You don't currently meet the criteria for this pathway", body:"Because your BMI is between 27 and 30, this pathway requires a qualifying weight-related health condition. Based on your answers, we're not able to continue through this route today.", ctas:[{label:'View other weight-management support', action:'restart'},{label:'Speak to my GP', action:'restart'},{label:'Exit assessment', action:'restart'}]},
    urgentMedical: {title:"Please seek urgent medical advice", body:"Based on your answers, we recommend you speak to a doctor or call NHS 111 before continuing with this assessment. Severe abdominal pain, repeated vomiting or dehydration, and sudden visual symptoms all need to be checked by a clinician.", ctas:[{label:'Exit assessment', action:'restart'}], urgent:true},
    seriousAllergy: {title:"We need to review this with you directly", body:"You've told us about a previous serious reaction to a medicine. A prescriber will need to review this with you personally before any treatment can be considered, so we're pausing the automated assessment here.", ctas:[{label:'Exit assessment — a prescriber will be in touch', action:'restart'}]},
    pregnancy: {title:"This pathway isn't suitable during pregnancy", body:"These medicines should not be used during pregnancy, so we're not able to continue with this assessment. Please speak to your GP or midwife about safe options.", ctas:[{label:'Exit assessment', action:'restart'}]},
    breastfeeding: {title:"This pathway isn't suitable while breastfeeding", body:"Safety hasn't been established for these medicines while breastfeeding, so we're not able to continue with this assessment. Please speak to your GP about safe options.", ctas:[{label:'Exit assessment', action:'restart'}]},
    eatingDisorderActive: {title:"Let's get you the right support first", body:"Based on your answers, this pathway isn't the right next step for you today. Weight-management medicines aren't suitable where there are current eating-disorder behaviours. We'd like to help you access the right support instead.", ctas:[{label:'Speak to my GP', action:'restart'},{label:'Exit assessment', action:'restart'}], crisis:false},
    selfHarmUrgent: {title:"We're concerned about you and want to help", body:"Thank you for telling us. Because of what you've shared, we're not able to continue with this automated assessment — this needs a real conversation with someone who can support you properly.", ctas:[{label:'Exit assessment', action:'restart'}], crisis:true},
    immediateDanger: {title:"Your safety matters most right now", body:"You've told us you don't currently feel safe. Please reach out for support right away using the details below.", ctas:[{label:'Exit assessment', action:'restart'}], crisis:true},
    safeguardingConcern: {title:"We need to speak with you directly", body:"Based on what you've told us, this isn't something an automated assessment can safely take further. A member of our clinical team needs to speak with you personally before we can continue.", ctas:[{label:'Exit assessment', action:'restart'}], crisis:true}
  };

  function heightCmValue(a){
    if ((a.height_unit || 'cm') === 'cm') return parseFloat(a.heightCm) || null;
    const ft = parseFloat(a.height_ft) || 0, inch = parseFloat(a.height_in) || 0;
    if (!ft && !inch) return null;
    return (ft * 12 + inch) * 2.54;
  }
  function weightKgValue(a){
    if ((a.weight_unit || 'kg') === 'kg') return parseFloat(a.weightKg) || null;
    const st = parseFloat(a.weight_st) || 0, lb = parseFloat(a.weight_lb) || 0;
    if (!st && !lb) return null;
    return (st * 14 + lb) * 0.453592;
  }
  function bmiOf(a){
    const h = heightCmValue(a), w = weightKgValue(a);
    if (!h || !w) return null;
    const m = h/100;
    return w/(m*m);
  }
  function bmiBand(a){
    const b = bmiOf(a);
    if (b === null) return null;
    if (b >= 30) return 'high';
    if (b >= 27) return 'mid';
    return 'low';
  }

  const STAGE1_STEPS = [
    {id:'welcome', stage:1, type:'welcome'},
    {id:'inUK', stage:1, type:'radio', q:"Are you currently in the UK?", options:YESNO, required:true},
    {id:'forSelf', stage:1, type:'radio', q:"Are you completing this assessment for yourself?", options:YESNO, required:true},
    {id:'understandsDecision', stage:1, type:'radio', q:"Do you understand that a prescriber will make the final decision?", options:YESNO, required:true},
    {id:'details_group', stage:1, type:'group', q:"Tell us about yourself", fields:[
      {id:'fullName', label:'Full name', type:'text', required:true},
      {id:'dob', label:'Date of birth', type:'date', required:true},
      {id:'address', label:'Address', type:'textarea', required:true},
      {id:'phone', label:'Telephone number', type:'tel', required:true},
      {id:'email', label:'Email address', type:'email', required:true},
      {id:'deliveryAddress', label:'Delivery address (if different)', type:'textarea', required:false},
      {id:'sex', label:'Gender', type:'select', options:['Female','Male','Other','Prefer not to say'], required:true},
      {id:'ethnicity', label:'Ethnicity', type:'select', options:ETHNICITY_OPTIONS, required:true},
      {id:'nhs_number', label:'NHS number, if available', type:'text', required:false}
    ]},
    {id:'id_upload', stage:1, type:'file', q:"Please upload a photo ID", hint:"A passport, driving licence, or national ID card.", required:true},
    {id:'photo_face', stage:1, type:'live_photo', q:"Let's take a photo of your face", hint:"Make sure you're in a well-lit space and looking directly at the camera.", required:true},
    {id:'video_scales', stage:1, type:'live_video', q:"Now, a live video of you on the scales", hint:"Stand fully on the scales so your whole body and the weight reading are both visible. Recording stops automatically after 15 seconds.", required:true},
    {id:'scr_consent', stage:1, type:'radio', q:"Do you agree for us to check your NHS Summary Care Record (SCR)?", hint:"If you haven't already opted in to sharing your Summary Care Record, we'll ask your GP practice to enable this so your prescriber can see relevant medical history.", options:YESNO, required:true},
    {id:'consent_remote', stage:1, type:'radio', q:"Do you consent to remote clinical assessment?", options:YESNO, required:true},
    {id:'consent_contact', stage:1, type:'radio', q:"Do you agree to be contacted by the prescriber if required?", options:YESNO, required:true},
    {id:'consent_gp_contact', stage:1, type:'radio', q:"Do you consent to us contacting your GP or regular prescriber if needed?", options:YESNO, required:true},
    {id:'consent_other_provider', stage:1, type:'radio', q:"Do you consent to us contacting another weight-management provider, where necessary?", options:YESNO, required:true},
    {id:'pathway_choice', stage:1, type:'radio', q:"Which best describes you?", options:[
      {v:'new', l:"I've never used a weight-management medicine"},
      {v:'continuing', l:"I'm currently using one"},
      {v:'restarting', l:'I previously used one but stopped, and want to restart'},
      {v:'transferring', l:"I'm using one from another provider and want to transfer"},
      {v:'switching', l:'I want to switch to a different medicine'}
    ], required:true}
  ];

  const MEASUREMENTS_STEP = {id:'measurements_group', stage:2, type:'group', q:"Your weight and height", fields:[
    {id:'weight', label:'Weight', type:'weight', required:true},
    {id:'weightDate', label:'Date measured', type:'date', required:true},
    {id:'weightSource', label:'Source of weight measurement', type:'select', options:SOURCE_OPTIONS, required:true},
    {id:'height', label:'Height', type:'height', required:true},
    {id:'heightDate', label:'Date measured', type:'date', required:true},
    {id:'heightSource', label:'Source of height measurement', type:'select', options:SOURCE_OPTIONS, required:true},
    {id:'waist', label:'Waist circumference (cm), if applicable', type:'number', required:false},
    {id:'evidenceUpload', label:'Supporting evidence upload (optional)', type:'file', required:false}
  ]};

  const COULD_BECOME_PREGNANT_STEP = {id:'could_become_pregnant', stage:2, type:'radio', q:"Could you become pregnant?", options:YESNO, required:true, condition:a=>a.sex!=='Male'};
  const PREGNANCY_GROUP_STEP = {id:'pregnancy_group', stage:2, type:'group', q:"Pregnancy and contraception", condition:a=>a.could_become_pregnant==='yes', fields:[
    {id:'pregnant', label:'Are you pregnant or possibly pregnant?', type:'yesno', required:true},
    {id:'lastPeriodDate', label:'Date of your last menstrual period, if known', type:'date', required:false, condition:a=>a.pregnant!=='yes'},
    {id:'tryingConceive', label:'Are you trying to become pregnant?', type:'yesno', required:true},
    {id:'planPregnancyDuring', label:'Do you plan to become pregnant during treatment?', type:'yesno', required:true},
    {id:'breastfeeding', label:'Are you breastfeeding?', type:'yesno', required:true},
    {id:'pcos', label:'Have you been diagnosed with polycystic ovary syndrome (PCOS)?', type:'yesno', required:true},
    {id:'gestationalDiabetes', label:'Have you ever had gestational diabetes or diabetes in pregnancy?', type:'yesno', required:true},
    {id:'pregnancyComplications', label:'Any other pregnancy complications relevant to your weight or metabolism?', type:'yesno', required:true},
    {id:'pregnancyComplicationsDetails', label:'Please give brief details', type:'textarea', required:true, condition:a=>a.pregnancyComplications==='yes'},
    {id:'usingContraception', label:'Are you using contraception?', type:'yesno', required:true},
    {id:'contraceptionType', label:'What type of contraception are you using?', type:'text', required:true, condition:a=>a.usingContraception==='yes'},
    {id:'oralContraceptive', label:'Are you using an oral contraceptive?', type:'yesno', required:true},
    {id:'contraceptionAdviceNotice', label:'', type:'notice', content:"<strong>Contraception advice:</strong> Some weight-management medicines can reduce the effectiveness of oral contraceptives — particularly during dose increases, or if they cause vomiting or diarrhoea. Depending on the medicine your prescriber confirms is suitable for you, you may be advised to use an additional barrier method (such as condoms) for a period of time. Your prescriber will confirm the exact advice for your specific medicine before you start treatment.", required:false},
    {id:'understandsContraceptionAdvice', label:'I have read and understood this advice', type:'yesno', required:true}
  ]};

  const BMI_ELIGIBILITY_STEP = {id:'bmi_eligibility', stage:2, type:'eligibility'};
  const COMORBIDITY_STEP = {id:'comorbidity', stage:2, type:'multi', q:"Do you have any of these health conditions?", options:COMORBIDITY, exclusive:'none', required:true};
  const MEDICAL_HISTORY_STEP = {id:'medical_history', stage:2, type:'trigroup', q:"Your medical history", items:MEDICAL_HISTORY, required:true};
  const MEDICAL_HISTORY_DETAILS_STEP = {id:'medical_history_details', stage:2, type:'group', q:"Tell us more about your medical history",
    condition:a=>['diabetes_type','pancreatitis','kidney_liver','bariatric_surgery','active_cancer'].some(k=>a['mh_'+k]==='yes'),
    fields:[
      {id:'diabetesType', label:'What type of diabetes?', type:'select', options:['Type 1','Type 2','Prediabetes'], required:true, condition:a=>a.mh_diabetes_type==='yes'},
      {id:'diabetesTreatment', label:'Current diabetes treatment', type:'text', required:true, condition:a=>a.mh_diabetes_type==='yes'},
      {id:'diabetesHypoglycaemia', label:'Do you experience hypoglycaemia?', type:'yesno', required:true, condition:a=>a.mh_diabetes_type==='yes'},
      {id:'diabetesComplications', label:'Any diabetes-related complications?', type:'textarea', required:false, condition:a=>a.mh_diabetes_type==='yes'},
      {id:'pancreatitisWhen', label:'When did the pancreatitis episode occur?', type:'text', required:true, condition:a=>a.mh_pancreatitis==='yes'},

  const answers = {};

  function scoffScore(a){
    const items = ['scoff1','scoff2','scoff3','scoff4','scoff5'];
    if (!items.every(k => a[k] !== undefined)) return null;
    return items.filter(k => a[k] === 'yes').length;
  }
  function phq9Score(a){
    const items = ['phq1','phq2','phq3','phq4','phq5','phq6','phq7','phq8','phq9'];
    if (!items.every(k => a[k] !== undefined)) return null;
    return items.reduce((sum,k)=> sum + parseInt(a[k],10), 0);
  }
  function phq9Band(score){
    if (score < 5) return 'Minimal';
    if (score < 10) return 'Mild';
    if (score < 15) return 'Moderate';
    if (score < 20) return 'Moderately severe';
    return 'Severe';
  }

  function pickVideoMimeType(){
    const candidates = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4;codecs=avc1','video/mp4'];
    for (const c of candidates){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    }
    return ''; // let the browser choose its own default
  }

  function stopCurrentStream(){
    if (currentStream){
      currentStream.getTracks().forEach(t=>t.stop());
      currentStream = null;
    }
    if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
    mediaRecorder = null;
    recordedChunks = [];
  }

  function initLivePhoto(step){
    if (answers[step.id]){
      const retakeBtn = document.getElementById('retakeBtn');
      if (retakeBtn) retakeBtn.addEventListener('click', ()=>{
        answers[step.id] = undefined;
        stopCurrentStream();
        render();
      });
      return;
    }
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}})
      .then(stream=>{
        currentStream = stream;
        const video = document.getElementById('camPreview');
        if (video) video.srcObject = stream;
      })
      .catch(()=>{
        const card = document.getElementById('camCard');
        if (card) card.innerHTML = '<p style="padding:16px;margin:0;font-size:13.5px;">Camera access is needed to take this photo. Please allow camera permissions in your browser and try again.</p>';
      });
    const captureBtn = document.getElementById('captureBtn');
    if (captureBtn) captureBtn.addEventListener('click', ()=>{
      const video = document.getElementById('camPreview');
      if (!video || !video.videoWidth) return;
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      answers[step.id] = canvas.toDataURL('image/jpeg', 0.9);
      stopCurrentStream();
      render();
    });
  }

  function initLiveVideo(step){
    if (answers[step.id]){
      const retakeBtn = document.getElementById('retakeVideoBtn');
      if (retakeBtn) retakeBtn.addEventListener('click', ()=>{
        answers[step.id] = undefined;
        stopCurrentStream();
        render();
      });
      return;
    }
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false})
      .then(stream=>{
        currentStream = stream;
        const video = document.getElementById('camPreviewV');
        if (video) video.srcObject = stream;
      })
      .catch(()=>{
        const card = document.getElementById('camCardV');
        if (card) card.innerHTML = '<p style="padding:16px;margin:0;font-size:13.5px;">Camera access is needed to record this video. Please allow camera permissions in your browser and try again.</p>';
      });

    const recordBtn = document.getElementById('recordBtn');
    let recording = false;
    let seconds = 0;
    if (recordBtn) recordBtn.addEventListener('click', ()=>{
      if (!recording){
        if (!currentStream) return;
        recordedChunks = [];
        const chosenMime = pickVideoMimeType();
        mediaRecorder = new MediaRecorder(currentStream, chosenMime ? {mimeType: chosenMime} : undefined);
        mediaRecorder.ondataavailable = e=>{ if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = ()=>{
          const blob = new Blob(recordedChunks, {type: chosenMime || 'video/mp4'});
          answers[step.id] = URL.createObjectURL(blob);
          stopCurrentStream();
          render();
        };
        mediaRecorder.start();
        recording = true;
        seconds = 0;
        const ind = document.getElementById('recIndicator');
        if (ind) ind.style.display = 'block';
        recordBtn.textContent = 'Stop recording';
        recordTimerHandle = setInterval(()=>{
          seconds++;
          const t = document.getElementById('recTimer');
          if (t) t.textContent = seconds + 's';
          if (seconds >= 15 && mediaRecorder && mediaRecorder.state === 'recording'){
            mediaRecorder.stop();
          }
        }, 1000);
      } else {
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
      }
    });
  }

  function computeAmberFlags(a){
    const flags = [];
    if (a.understandsDecision === 'no') flags.push("didn't confirm understanding of prescriber decision");
    const band = bmiBand(a);
    if (band === 'mid') flags.push('BMI 27–30 with qualifying condition — pending verification');
    MEDICAL_HISTORY.forEach(item=>{
      if (item.v !== 'severe_abdo_pain' && item.v !== 'vomiting_dehydration' && a['mh_'+item.v] === 'yes') flags.push(item.l);
      if (a['mh_'+item.v] === 'unsure') flags.push(item.l + ' (unsure)');
    });
    if (a.planPregnancyDuring === 'yes') flags.push('planning pregnancy during treatment');
    if (a.oralContraceptive === 'yes') flags.push('oral contraceptive use — counselling may be required');
    if (a.eatingDisorderHistory === 'past') flags.push('previous eating disorder');
    const phq = phq9Score(a);
    if (phq !== null && phq >= 10) flags.push('PHQ-9 score '+phq+'/27 (moderate or above)');
    if (!a.consentContactGP || a.consentContactGP === 'no' || (!a.gpPractice && !a.otherProvider)) flags.push('no GP/provider details or consent — prescriber risk assessment required');
    if (a.wantsToDiscuss === 'yes') flags.push('patient requested direct contact with the clinical team before treatment is considered');
    return flags;
  }

  function ageFromDob(dobStr){
    if (!dobStr) return null;
    const dob = new Date(dobStr);
    if (isNaN(dob.getTime())) return null;
    const today = new Date();
    let age = today.getFullYear() - dob.getFullYear();
    const m = today.getMonth() - dob.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
    return age;
  }

  function detectExit(step, a){
    if (step.id === 'details_group'){
      const age = ageFromDob(a.dob);
      if (age !== null && age < 18) return EXIT.ageRestricted;
    }
    if (step.id === 'inUK' && a.inUK === 'no') return EXIT.jurisdiction;
    if (step.id === 'consent_remote' && a.consent_remote === 'no') return EXIT.noConsent;
    if (step.id === 'forSelf' && a.forSelf === 'no') return EXIT.notForSelf;
    if (step.id === 'comorbidity'){
      const band = bmiBand(a);
      const chosen = a.comorbidity || [];
      const hasQualifying = chosen.some(v => v !== 'none' && v !== 'unsure');
      if (band === 'mid' && !hasQualifying) return EXIT.notEligibleComorbid;
    }
    if (step.id === 'medical_history'){
      if (a.mh_severe_abdo_pain === 'yes' || a.mh_vomiting_dehydration === 'yes' || a.mh_visual_symptoms === 'yes') return EXIT.urgentMedical;
    }
    if (step.id === 'medicines_group' && a.seriousReaction === 'yes') return EXIT.seriousAllergy;
    if (step.id === 'pregnancy_group'){
      if (a.pregnant === 'yes') return EXIT.pregnancy;
      if (a.breastfeeding === 'yes') return EXIT.breastfeeding;
    }
    if (step.id === 'scoff_group'){
      const s = scoffScore(a);
      if ((s !== null && s >= 2) || a.eatingDisorderHistory === 'current') return EXIT.eatingDisorderActive;
    }
    if (step.id === 'mental_health_group'){
      if (a.mentalHealthUnstable === 'yes' || a.capacityConcern === 'yes' || a.safeguardingConcern === 'yes') return EXIT.safeguardingConcern;
      if (a.feelsSafe === 'no') return EXIT.immediateDanger;
      if (a.phq9 && a.phq9 !== '0') return EXIT.selfHarmUrgent;
    }
    return null;
  }

  function isValid(step){
    if (step.type === 'welcome' || step.type === 'eligibility' || step.type === 'score_result' || step.type === 'review') return true;
    if (step.type === 'file' || step.type === 'live_photo' || step.type === 'live_video') return !!answers[step.id];
    if (step.type === 'radio' || step.type === 'multi'){
      const v = answers[step.id];
      if (step.type === 'multi') return Array.isArray(v) && v.length > 0;
      return !!v;
    }
    if (step.type === 'trigroup'){
      return step.items.every(item => !!answers['mh_'+item.v]);
    }
    if (step.type === 'group'){
      return step.fields.every(f=>{
        if (f.condition && !f.condition(answers)) return true;
        if (!f.required) return true;
        if (f.type === 'height') return heightCmValue(answers) !== null;
        if (f.type === 'weight') return weightKgValue(answers) !== null;
        const v = answers[f.id];
        if (f.type === 'file') return true; // optional-in-practice, no persistence layer
        return v !== undefined && v !== null && String(v).trim() !== '';
      });
    }
    if (step.type === 'declaration') return answers.declaration_confirmed === true;
    return true;
  }

  function fieldControlHtml(f){
    const v = answers[f.id];
    if (f.condition && !f.condition(answers)) return '';
    if (f.type === 'notice'){
      return `<div class="key-copy" style="margin:16px 0;">${f.content}</div>`;
    }
    let inner = '';
    if (f.type === 'yesno' || f.type === 'yesnona'){
      const opts = f.type === 'yesnona' ? YESNONA : YESNO;
      inner = `<div class="inline-yesno" data-field="${f.id}">` + opts.map(o=>`<button type="button" class="inline-btn ${v===o.v?'selected':''}" data-field="${f.id}" data-value="${o.v}">${o.l}</button>`).join('') + `</div>`;
    } else if (f.type === 'select3'){
      inner = `<div class="inline-yesno" data-field="${f.id}">` + f.options.map(o=>`<button type="button" class="inline-btn ${v===o.v?'selected':''}" data-field="${f.id}" data-value="${o.v}">${o.l}</button>`).join('') + `</div>`;
    } else if (f.type === 'select'){
      inner = `<select data-field="${f.id}"><option value="">Please select</option>` + f.options.map(o=>`<option value="${o}" ${v===o?'selected':''}>${o}</option>`).join('') + `</select>`;
    } else if (f.type === 'textarea'){
      inner = `<textarea data-field="${f.id}" rows="3">${v||''}</textarea>`;
    } else if (f.type === 'file'){
      inner = `<input type="file" data-field="${f.id}">`;
    } else if (f.type === 'height'){
      const unit = answers.height_unit || 'cm';
      inner = `<select data-unit-toggle="height"><option value="cm" ${unit==='cm'?'selected':''}>Centimetres</option><option value="ftin" ${unit==='ftin'?'selected':''}>Feet & inches</option></select>`;
      if (unit === 'cm'){
        inner += `<input type="number" data-field="heightCm" placeholder="e.g. 170" value="${answers.heightCm||''}" style="margin-top:8px;">`;
      } else {
        inner += `<div style="display:flex;gap:8px;margin-top:8px;">
          <input type="number" data-field="height_ft" placeholder="Feet" value="${answers.height_ft||''}">
          <input type="number" data-field="height_in" placeholder="Inches" value="${answers.height_in||''}">
        </div>`;
      }
    } else if (f.type === 'weight'){
      const unit = answers.weight_unit || 'kg';
      inner = `<select data-unit-toggle="weight"><option value="kg" ${unit==='kg'?'selected':''}>Kilograms</option><option value="stlb" ${unit==='stlb'?'selected':''}>Stone & pounds</option></select>`;
      if (unit === 'kg'){
        inner += `<input type="number" data-field="weightKg" placeholder="e.g. 90" value="${answers.weightKg||''}" style="margin-top:8px;">`;
      } else {
        inner += `<div style="display:flex;gap:8px;margin-top:8px;">
          <input type="number" data-field="weight_st" placeholder="Stone" value="${answers.weight_st||''}">
          <input type="number" data-field="weight_lb" placeholder="Pounds" value="${answers.weight_lb||''}">
        </div>`;
      }
    } else {
      inner = `<input type="${f.type}" data-field="${f.id}" value="${v||''}">`;
    }
    return `<div class="group-field"><label>${f.label}${f.required?' *':''}</label>${inner}${f.hint?`<div class="subhint">${f.hint}</div>`:''}</div>`;
  }

  function render(){
    if (terminal){ renderTerminal(); return; }
    const steps = visibleSteps();
    let idx = steps.findIndex(s=>s.id===currentStepId);
    if (idx < 0) idx = 0;
    const step = steps[idx];
    const qBlock = document.getElementById('questionBlock');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');

    renderStageIndicator(step.stage);

    let html = '';

    if (step.type === 'welcome'){
      document.getElementById('progressLine').style.display = 'none';
      html = `<div class="welcome-screen">
        <h1>Start your weight-management assessment</h1>
        <div class="key-copy">
          This is a clinical consultation, not a shopping or automatic approval process. Completing it does not guarantee treatment or supply.<br><br>
          The information you provide may be checked against your clinical records or another healthcare provider. Your prescriber may ask to speak with you by secure message, telephone, video or in person before making a decision.<br><br>
          Treatment is subject to licensed indications, NICE guidance and local formulary or commissioning requirements.<br><br>
          If you have urgent symptoms, please do not use this routine online pathway — contact NHS 111, your GP, or 999 in an emergency.
        </div>
        <div class="welcome-cta-list">
          <button type="button" class="capture-btn" id="startBtn">Start assessment</button>
          <button type="button" class="capture-btn" id="signinBtn">Sign in</button>
          <button type="button" class="capture-btn" id="howBtn">How this works</button>
        </div>
      </div>`;
      qBlock.innerHTML = html;
      document.getElementById('actionsBlock').style.display = 'none';
      document.getElementById('startBtn').addEventListener('click', ()=>{ document.getElementById('actionsBlock').style.display=''; document.getElementById('progressLine').style.display=''; currentStepId = visibleSteps()[1].id; render(); });
      document.getElementById('signinBtn').addEventListener('click', ()=>{ alert("Sign-in isn't wired up in this preview."); });
      document.getElementById('howBtn').addEventListener('click', ()=>{ alert('This short assessment covers your details, health history and treatment suitability. A prescriber reviews everything before any decision is made.'); });
      return;
    }

    document.getElementById('progressLine').style.display = '';
    document.getElementById('actionsBlock').style.display = '';

    if (step.type === 'radio' || step.type === 'multi'){
      html += `<h1>${step.q}</h1>`;
      if (step.hint) html += `<p class="question-hint">${step.hint}</p>`;
      html += `<div class="choose-label">${step.type==='multi'?'Choose all that apply':'Choose Option'}</div>`;
      html += `<div class="option-list">` + step.options.map(o=>{
        const sel = step.type==='multi' ? (Array.isArray(answers[step.id])&&answers[step.id].includes(o.v)) : answers[step.id]===o.v;
        return `<button type="button" class="option-btn ${step.type==='multi'?'multi':''} ${sel?'selected':''}" data-value="${o.v}">${o.l}</button>`;
      }).join('') + `</div>`;
    } else if (step.type === 'trigroup'){
      html += `<h1>${step.q}</h1>`;
      html += `<p class="question-hint">Answer Yes, No, or Unsure for each.</p>`;
      html += `<div class="info-card" style="padding:6px 18px;">` + step.items.map(item=>{
        const cur = answers['mh_'+item.v];
        return `<div class="tri-row"><div class="tri-label">${item.l}</div><div class="tri-btns">
          <button type="button" class="tri-btn ${cur==='yes'?'selected':''}" data-mh="${item.v}" data-val="yes">Yes</button>
          <button type="button" class="tri-btn ${cur==='no'?'selected':''}" data-mh="${item.v}" data-val="no">No</button>
          <button type="button" class="tri-btn ${cur==='unsure'?'selected':''}" data-mh="${item.v}" data-val="unsure">Unsure</button>
        </div></div>`;
      }).join('') + `</div>`;
    } else if (step.type === 'group'){
      html += `<h1>${step.q}</h1>`;
      if (step.intro) html += `<p class="question-hint">${step.intro}</p>`;
      html += step.fields.map(fieldControlHtml).join('');
    } else if (step.type === 'file'){
      html += `<h1>${step.q}</h1>`;
      if (step.hint) html += `<p class="question-hint">${step.hint}</p>`;
      const chosenName = answers[step.id + '_name'];
      if (answers[step.id] && chosenName){
        html += `<div class="info-card">✓ File selected: ${chosenName}</div>`;
        html += `<div class="option-list"><button type="button" class="capture-btn" id="changeFileBtn">Choose a different file</button></div>`;
      } else {
        html += `<input type="file" id="fileInput" accept="image/*,application/pdf">`;
      }
    } else if (step.type === 'live_photo'){
      html += `<h1>${step.q}</h1>`;
      if (step.hint) html += `<p class="question-hint">${step.hint}</p>`;
      if (answers[step.id]){
        html += `<div class="info-card" style="padding:0;overflow:hidden;"><img id="capturedImg" src="${answers[step.id]}" style="width:100%;display:block;border-radius:10px;"></div>`;
        html += `<div class="option-list"><button type="button" class="capture-btn" id="retakeBtn">Retake photo</button></div>`;
      } else {
        html += `<div class="info-card" id="camCard" style="padding:0;overflow:hidden;"><video id="camPreview" autoplay playsinline muted style="width:100%;display:block;border-radius:10px;background:#111;"></video></div>`;
        html += `<div class="option-list"><button type="button" class="capture-btn" id="captureBtn">Take photo</button></div>`;
      }
    } else if (step.type === 'live_video'){
      html += `<h1>${step.q}</h1>`;
      if (step.hint) html += `<p class="question-hint">${step.hint}</p>`;
      if (answers[step.id]){
        html += `<div class="info-card" style="padding:0;overflow:hidden;"><video id="recordedPreview" src="${answers[step.id]}" controls style="width:100%;display:block;border-radius:10px;"></video></div>`;
        html += `<div class="option-list"><button type="button" class="capture-btn" id="retakeVideoBtn">Retake video</button></div>`;
      } else {
        html += `<div class="info-card" id="camCardV" style="padding:0;overflow:hidden;position:relative;">
                    <video id="camPreviewV" autoplay playsinline muted style="width:100%;display:block;border-radius:10px;background:#111;"></video>
                    <div id="recIndicator" style="display:none;position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;">● REC <span id="recTimer">0s</span></div>
                  </div>`;
        html += `<div class="option-list"><button type="button" class="capture-btn" id="recordBtn">Start recording</button></div>`;
      }
    } else if (step.type === 'eligibility'){
      const band = bmiBand(answers);
      const b = bmiOf(answers);
      html += `<h1>Your initial eligibility check</h1>`;
      if (b !== null){
        html += `<div class="info-card"><div class="hint">Your preliminary BMI</div><div class="bmi-value">${Math.round(b*10)/10}</div></div>`;
      }
      if (band === 'high'){
        html += `<div class="key-copy">Your BMI is within the usual licensed BMI range for consideration of weight management medicines. A prescriber must still review your health information and verify your measurements.</div>`;
      } else if (band === 'mid'){
        html += `<div class="key-copy">Because your BMI is between 27 and 30, we need to ask whether you have a weight-related health condition.</div>`;
      } else if (band === 'low'){
        terminal = EXIT.notEligibleBmi;
        renderTerminal();
        return;
      }
    } else if (step.type === 'score_result'){
      const result = step.compute(answers);
      html += `<h1>${step.title}</h1>`;
      if (result){
        html += `<div class="info-card"><div class="hint">${result.label}</div><div class="bmi-value">${result.value}</div><span class="cat">${result.band}</span></div>`;
        if (result.note) html += `<p class="question-hint">${result.note}</p>`;
      } else {
        html += `<div class="info-card">We couldn't calculate this — please go back and check your answers.</div>`;
      }
    } else if (step.type === 'declaration'){
      html += `<h1>Confirm and submit</h1>`;
      html += `<div class="key-copy">I confirm that I completed this consultation myself, and that the information I have provided is complete and accurate to the best of my knowledge. I have disclosed all relevant medicines and treatment from other providers. I understand that treatment is subject to clinical suitability and that this questionnaire does not guarantee a prescription. I know how to obtain urgent help if I need it. I consent to the proposed clinical review process, and understand the prescriber may ask further questions, verify my information, contact my GP or regular prescriber, or arrange another type of consultation.</div>`;
      const sel = answers.declaration_confirmed === true;
      html += `<div class="option-list"><button type="button" class="option-btn ${sel?'selected':''}" id="declBtn">I confirm this declaration</button></div>`;
    } else if (step.type === 'review'){
      document.getElementById('progressLine').style.display = 'none';
      html += `<h1>Check your answers</h1>`;
      html += reviewSectionsHtml();
    }

    qBlock.innerHTML = html;
    wireStepEvents(step);

    const visibleTotal = steps.filter(s=>s.type!=='welcome').length;
    const posIdx = steps.indexOf(step);
    const pct = Math.round((posIdx/(steps.length-1))*100);
    document.getElementById('progressText').textContent = pct + '% Complete';

    prevBtn.hidden = (posIdx <= 1);
    nextBtn.textContent = step.type === 'declaration' ? 'Submit for clinical review →'
      : (step.type === 'review' ? 'Continue to declaration →' : 'Next →');

    updateNextState();
  }

  function reviewSectionsHtml(){
    const sections = [
      {label:'Your details', keys:['fullName','dob','address','phone','email','ethnicity'], edit:'details_group'},
      {label:'Measurements', keys:['weightKg','heightCm'], edit:'measurements_group'},
      {label:'Health conditions', keys:['comorbidity'], edit:'comorbidity'},
      {label:'Medical history', keys:null, edit:'medical_history'},
      {label:'Medicines', keys:['currentMeds','allergyList'], edit:'medicines_group'},
      {label:'Pregnancy', keys:['pregnant','breastfeeding','usingContraception'], edit:'pregnancy_group'},
      {label:'Mental health', keys:['phq9','feelsSafe'], edit:'mental_health_group'},
      {label:'Your goals', keys:['goalsText'], edit:'goals_group'},
      {label:'GP details', keys:['gpPractice','consentContactGP'], edit:'gp_group'}
    ];
    return sections.map(sec=>{
      let body;
      if (sec.label === 'Medical history'){
        const flagged = MEDICAL_HISTORY.filter(i=>answers['mh_'+i.v] && answers['mh_'+i.v]!=='no').map(i=>i.l);
        body = flagged.length ? flagged.join(', ') : 'No concerns reported';
      } else if (sec.label === 'Measurements'){
        const h = heightCmValue(answers), w = weightKgValue(answers);
        body = (h && w) ? `${Math.round(w*10)/10} kg, ${Math.round(h)} cm` : '—';
      } else {
        body = sec.keys.map(k=>{
          const v = answers[k];
          if (Array.isArray(v)) return v.join(', ');
          return v || '—';
        }).join(' · ');
      }
      return `<div class="review-section"><div class="rs-head"><h3>${sec.label}</h3><button type="button" class="rs-edit" data-goto="${sec.edit}">Edit</button></div><div class="rs-body">${body}</div></div>`;
    }).join('');
  }

  function wireStepEvents(step){
    const qBlock = document.getElementById('questionBlock');

    qBlock.querySelectorAll('.option-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const val = btn.dataset.value;
        if (step.type === 'multi'){
          let arr = Array.isArray(answers[step.id]) ? answers[step.id].slice() : [];
          if (step.exclusive && val === step.exclusive){
            arr = arr.includes(val) ? [] : [step.exclusive];
          } else {
            if (arr.includes(val)) arr = arr.filter(x=>x!==val);
            else { arr.push(val); if (step.exclusive) arr = arr.filter(x=>x!==step.exclusive); }
          }
          answers[step.id] = arr;
        } else {
          answers[step.id] = val;
        }
        render();
      });
    });

    qBlock.querySelectorAll('.tri-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        answers['mh_'+btn.dataset.mh] = btn.dataset.val;
        render();
      });
    });

    qBlock.querySelectorAll('.inline-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        answers[btn.dataset.field] = btn.dataset.value;
        render();
      });
    });

    qBlock.querySelectorAll('input[data-field], textarea[data-field]').forEach(el=>{
      el.addEventListener('input', ()=>{
        answers[el.dataset.field] = el.type === 'file' ? (el.files && el.files.length>0) : el.value;
        if (el.dataset.field === 'dob'){
          const age = ageFromDob(el.value);
          if (age !== null && age < 18){
            stopCurrentStream();
            terminal = EXIT.ageRestricted;
            render();
            window.scrollTo({top:0});
            return;
          }
        }
        updateNextState();
      });
    });
    qBlock.querySelectorAll('select[data-field]').forEach(el=>{
      el.addEventListener('change', ()=>{
        answers[el.dataset.field] = el.value;
        updateNextState();
      });
    });
    qBlock.querySelectorAll('[data-unit-toggle]').forEach(el=>{
      el.addEventListener('change', ()=>{
        answers[el.dataset.unitToggle + '_unit'] = el.value;
        render();
      });
    });

    const declBtn = document.getElementById('declBtn');
    if (declBtn) declBtn.addEventListener('click', ()=>{
      answers.declaration_confirmed = !(answers.declaration_confirmed === true);
      render();
    });

    qBlock.querySelectorAll('[data-goto]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const target = getSteps().find(s=>s.id===btn.dataset.goto);
        if (target){ currentStepId = target.id; render(); window.scrollTo({top:0}); }
      });
    });

    const fileInput = document.getElementById('fileInput');
    if (fileInput) fileInput.addEventListener('change', ()=>{
      const has = fileInput.files && fileInput.files.length > 0;
      answers[step.id] = has;
      answers[step.id + '_name'] = has ? fileInput.files[0].name : undefined;
      render();
    });
    const changeFileBtn = document.getElementById('changeFileBtn');
    if (changeFileBtn) changeFileBtn.addEventListener('click', ()=>{
      answers[step.id] = undefined;
      answers[step.id + '_name'] = undefined;
      render();
    });

    if (step.type === 'live_photo') initLivePhoto(step);
    if (step.type === 'live_video') initLiveVideo(step);
  }

  function renderStageIndicator(activeStage){
    const el = document.getElementById('stageIndicator');
    if (!el) return;
    el.innerHTML = STAGES.map((s,i)=>{
      const cls = s.n === activeStage ? 'active' : (s.n < activeStage ? 'done' : '');
      const pill = `<span class="stage-pill ${cls}">${s.n} ${s.label}</span>`;
      return i < STAGES.length-1 ? pill + `<span class="stage-line"></span>` : pill;
    }).join('');
  }

  function updateNextState(){
    if (terminal) return;
    const steps = visibleSteps();
    const step = steps.find(s=>s.id===currentStepId) || steps[0];
    document.getElementById('nextBtn').disabled = !isValid(step);
  }

  function goNext(){
    const steps = visibleSteps();
    const idx = steps.findIndex(s=>s.id===currentStepId);
    const step = steps[idx];
    if (!isValid(step)) return;

    const exit = detectExit(step, answers);
    if (exit){ stopCurrentStream(); terminal = exit; render(); window.scrollTo({top:0}); return; }

    if (step.id === 'declaration'){ stopCurrentStream(); submitForm(); return; }

    if (idx >= steps.length - 1) return;
    stopCurrentStream();
    currentStepId = steps[idx + 1].id;
    render();
    window.scrollTo({top:0});
  }

  function goPrev(){
    const steps = visibleSteps();
    const idx = steps.findIndex(s=>s.id===currentStepId);
    if (idx <= 1) return;
    stopCurrentStream();
    currentStepId = steps[idx - 1].id;
    render();
    window.scrollTo({top:0});
  }

  function renderTerminal(){
    document.getElementById('stageIndicator').innerHTML = '';
    document.getElementById('progressLine').style.display = 'none';
    const qBlock = document.getElementById('questionBlock');
    let html = `<h1>${terminal.title}</h1><div class="exit-card ${terminal.urgent?'':'neutral'}"><p>${terminal.body}</p></div>`;
    if (terminal.crisis){
      html += `<div class="crisis-box"><strong>If you need to talk to someone now</strong>
        Samaritans: call 116 123 (free, 24/7)<br>
        Text "SHOUT" to 85258<br>
        NHS: call 111<br>
        If you're in immediate danger, call 999 or go to A&E.</div>`;
    }
    html += `<div class="option-list" style="margin-top:22px;">` + terminal.ctas.map((c,i)=>`<button type="button" class="capture-btn" data-exit-cta="${i}">${c.label}</button>`).join('') + `</div>`;
    qBlock.innerHTML = html;
    document.getElementById('actionsBlock').style.display = 'none';
    qBlock.querySelectorAll('[data-exit-cta]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        stopCurrentStream();
        terminal = null;
        currentStepId = 'welcome';
        Object.keys(answers).forEach(k=>delete answers[k]);
        document.getElementById('actionsBlock').style.display = '';
        render();
        window.scrollTo({top:0});
      });
    });
  }

  function submitForm(){
    document.getElementById('stageIndicator').innerHTML = '';
    document.getElementById('progressLine').style.display = 'none';
    document.getElementById('actionsBlock').style.display = 'none';
    const amber = computeAmberFlags(answers);
    const qBlock = document.getElementById('questionBlock');
    qBlock.innerHTML = `<div class="final-screen">
      <h1>Your assessment has been submitted</h1>
      <p>A prescriber will review your assessment. They may contact you for further information or arrange a telephone, secure messaging, video or face-to-face consultation. Treatment is not guaranteed.</p>
      <div class="option-list" style="margin-top:26px; text-align:left;">
        <button type="button" class="capture-btn" id="goToTreatmentBtn">Choose your treatment</button>
      </div>
    </div>`;
    // Internal-only, never shown to patient: amber.length flags whether this routes as
    // "Assessment complete — prescriber review required" vs "Further clinical review required".
    document.getElementById('goToTreatmentBtn').addEventListener('click', renderTreatmentScreen);
  }

  function renderTreatmentScreen(){
    const qBlock = document.getElementById('questionBlock');
    let html = `<h1>Choose your treatment</h1>`;
    html += `<div class="key-copy">This step is separate from your clinical submission, which has already been sent for prescriber review. Your treatment choice is subject to clinical assessment and prescribing suitability — your prescriber will confirm whether this treatment is appropriate, and may recommend a different one if necessary.</div>`;
    html += `<div class="choose-label">Choose Option</div>`;
    html += `<div class="option-list">` + TREATMENT_PRODUCTS.map(p=>{
      const sel = answers.treatment_selection === p.v;
      return `<button type="button" class="capture-btn treatment-option ${sel?'selected':''}" data-value="${p.v}">${p.l}<div class="subhint">${p.price}</div></button>`;
    }).join('') + `</div>`;
    html += `<div class="option-list" style="margin-top:22px;"><button type="button" class="next-btn" id="payBtn" ${answers.treatment_selection?'':'disabled'}>Pay & continue →</button></div>`;
    qBlock.innerHTML = html;
    qBlock.querySelectorAll('.treatment-option').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        answers.treatment_selection = btn.dataset.value;
        renderTreatmentScreen();
      });
    });
    const payBtn = document.getElementById('payBtn');
    if (payBtn) payBtn.addEventListener('click', ()=>{
      const chosen = TREATMENT_PRODUCTS.find(p=>p.v === answers.treatment_selection);
      qBlock.innerHTML = `<div class="final-screen">
        <h1>Payment received</h1>
        <p>Thanks — we've received your payment for ${chosen ? chosen.l : 'your selected treatment'}. This does not change or guarantee the outcome of your clinical review, which is assessed independently by your prescriber.</p>
      </div>`;
      window.scrollTo({top:0});
    });
  }

  document.getElementById('nextBtn').addEventListener('click', goNext);
  document.getElementById('prevBtn').addEventListener('click', goPrev);

  render();
})();
</script>

</body>
</html>
